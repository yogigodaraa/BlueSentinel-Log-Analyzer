# Explicit lint baseline (ruff's classic defaults: pyflakes + core pycodestyle errors).
# Widen this deliberately, e.g. add "B" (bugbear) or "S" (bandit), once these are clean.
target-version = "py311"
exclude = [".venv"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Dev helper: puts the backend on sys.path before importing app modules.
"scripts/test_server.py" = ["E402"]
