name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Check names: "backend / test" and "frontend / test". Keep job ids stable.
  backend:
    uses: yogigodaraa/.github/.github/workflows/python-ci.yml@main
    with:
      working-directory: backend
      python-version: "3.11"
      # requirements.txt also pulls torch/transformers/spacy, which the code doesn't import.
      requirements: requirements-optimized.txt

  frontend:
    uses: yogigodaraa/.github/.github/workflows/node-ci.yml@main
    with:
      working-directory: frontend
      # "lint" is skipped until ESLint is configured (next lint currently prompts interactively).
      scripts: "type-check build"
